# Kimi (Moonshot) API 配置文件
# api_key 留空时自动读取环境变量 MOONSHOT_API_KEY / KIMI_API_KEY
api_key: ""

# OpenAI 兼容端点
base_url: "https://api.moonshot.cn/v1"

# 模型名，例如 kimi-k3 / kimi-k2-0905-preview
model: "kimi-k2.6"

# 采样参数。注意：kimi-k3 等推理模型只允许 temperature=1；
# 其它模型可调范围通常为 [0, 1]。填 0 表示不发送该字段，使用模型默认值。
temperature: 1
max_tokens: 2048

# 单次请求超时（秒）。大模型思考型请求可能较慢，给足余量
timeout_seconds: 180

# 系统提示词，控制模型的整体行为
system_prompt: "You are a helpful coding assistant. Follow user instructions."
